name: Avisar organizadores retroactivo (temporal)

# Corrida manual: manda el aviso de "tu evento ya está publicado" a
# organizadores de eventos ya confirmados/activos que se quedaron sin
# aviso. `desde` amplía la ventana más allá de "esta semana" (default del
# script) — usar una fecha vieja para cubrir todos los eventos ya
# publicados. No es un cron, es una migración puntual — este archivo se
# borra después de correrlo.

on:
  workflow_dispatch:
    inputs:
      escribir:
        description: "true = manda los mails de verdad; false = solo lista qué mandaría (dry-run)"
        required: true
        default: "false"
      desde:
        description: "Fecha de corte YYYY-MM-DD (vacío = lunes de esta semana, el default del script)"
        required: false
        default: ""
      limite:
        description: "Tope de mails reales a mandar (vacío = sin tope)"
        required: false
        default: ""
      uno_por_cuenta:
        description: "true = un solo aviso por cuenta (el evento más reciente), evita bombardear organizadores con varios eventos"
        required: false
        default: "false"

jobs:
  avisar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: import
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: import/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Avisar
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HIKERAPI_KEY: ${{ secrets.HIKERAPI_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SHARED_SECRET: ${{ secrets.APPS_SCRIPT_SHARED_SECRET }}
        run: |
          ARGS=""
          if [ "${{ inputs.escribir }}" = "true" ]; then ARGS="$ARGS --escribir"; fi
          if [ -n "${{ inputs.limite }}" ]; then ARGS="$ARGS --limite=${{ inputs.limite }}"; fi
          if [ -n "${{ inputs.desde }}" ]; then ARGS="$ARGS --desde=${{ inputs.desde }}"; fi
          if [ "${{ inputs.uno_por_cuenta }}" = "true" ]; then ARGS="$ARGS --uno-por-cuenta"; fi
          python -m src.avisar_organizadores_retroactivo $ARGS
