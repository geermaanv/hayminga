name: Avisar organizadores retroactivo (temporal)

# Corrida manual: manda el aviso de "tu evento ya está publicado" a
# organizadores de eventos ya confirmados/activos que se quedaron sin
# aviso (eventos de hashtag antes del fix del 16/09 — ver ROADMAP.md).
# No es un cron, es una migración puntual — este archivo se borra
# después de correrlo, mismo criterio que otros workflows temporales.

on:
  workflow_dispatch:
    inputs:
      escribir:
        description: "true = manda los mails de verdad; false = solo lista qué mandaría (dry-run)"
        required: true
        default: "false"
      limite:
        description: "Tope de mails reales a mandar (vacío = sin tope)"
        required: false
        default: ""

jobs:
  avisar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: import
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: import/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Avisar
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HIKERAPI_KEY: ${{ secrets.HIKERAPI_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SHARED_SECRET: ${{ secrets.APPS_SCRIPT_SHARED_SECRET }}
        run: |
          ARGS=""
          if [ "${{ inputs.escribir }}" = "true" ]; then ARGS="$ARGS --escribir"; fi
          if [ -n "${{ inputs.limite }}" ]; then ARGS="$ARGS --limite=${{ inputs.limite }}"; fi
          python -m src.avisar_organizadores_retroactivo $ARGS
