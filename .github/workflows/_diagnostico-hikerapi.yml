name: Diagnóstico puntual HikerAPI (descartable)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Un solo llamado a user/by/username
        env:
          HIKERAPI_KEY: ${{ secrets.HIKERAPI_KEY }}
        run: |
          curl -s -m 15 "https://api.hikerapi.com/v1/user/by/username?username=hayminga" \
            -H "x-access-key: $HIKERAPI_KEY" \
            -o /tmp/resp.json
          echo "--- respuesta (sin exponer la key) ---"
          cat /tmp/resp.json
          echo
          python3 -c "
import json
d = json.load(open('/tmp/resp.json'))
if d.get('state') is False:
    print('RESULTADO: FALLÓ -', d.get('error'))
else:
    print('RESULTADO: OK — campos:', sorted(d.keys()))
"
