name: Test aviso organizador (temporal)

# Prueba puntual: llama a avisar_evento_publicado() con las credenciales
# reales de producción para confirmar que el canal Code.gs sigue
# funcionando de punta a punta (ver ROADMAP.md — 0 avisos en 4 corridas
# seguidas del 17 al 20/09, hay que descartar una falla silenciosa antes
# de asumir que simplemente no había emails disponibles). Manda a
# germanv@gmail.com, no a un organizador real. Se borra después de usarla.

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: import
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: import/requirements.txt
      - run: pip install -r requirements.txt
      - name: Probar avisar_evento_publicado
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SHARED_SECRET: ${{ secrets.APPS_SCRIPT_SHARED_SECRET }}
        run: |
          python -c "
          from src.hiker_pipeline import avisar_evento_publicado
          resultado = avisar_evento_publicado(
              {'nombre': 'PRUEBA - ignorar'}, 'germanv@gmail.com', False, False,
          )
          print(f'RESULTADO: {resultado}')
          "
