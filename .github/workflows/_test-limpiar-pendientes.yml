name: "[Diagnóstico temporal] Limpiar pendientes vencidos"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: import

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: import/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Marcar descartado lo vencido en pendiente_confirmacion
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m src.limpiar_pendientes_vencidos --escribir
