name: TEMP - Migración de pendientes publicables (descarte de duplicados + migración)

on:
  workflow_dispatch:
    inputs:
      escribir:
        description: "Aplicar de verdad (false = dry-run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: import

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: import/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descartar los 4 reposts detectados en el dry-run (01/11)
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m src.descartar_duplicados_migracion_pendientes ${{ inputs.escribir && '--escribir' || '' }}

      - name: Migrar el resto del backlog a confirmado
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m src.migrar_pendientes_publicables ${{ inputs.escribir && '--escribir' || '' }}
