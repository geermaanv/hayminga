name: Resetear FuentesStats de fuentes restauradas (temporal)

# Corre resetear_fuentes_stats.py --escribir contra la Sheet real:
# restaurar config.json (PR #41) no toca el contador IntentosSinHit
# viejo, así que sin esto la próxima corrida de curar-fuentes.yml vuelve
# a dar de baja lo que se acaba de restaurar. No toca config.json, no
# corre HikerAPI/Gemini. Se borra después de usarla.

on:
  workflow_dispatch: {}

jobs:
  resetear:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: import

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: import/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Resetear FuentesStats (dry-run primero, log)
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m src.resetear_fuentes_stats

      - name: Resetear FuentesStats (aplicar)
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m src.resetear_fuentes_stats --escribir
