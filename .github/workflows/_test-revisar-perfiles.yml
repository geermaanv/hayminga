name: "[Diagnóstico temporal] Revisar perfiles de cuentas_protegidas"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  revisar-perfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: import

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: import/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar bio/sitio externo de cuentas_protegidas
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          HIKERAPI_KEY: ${{ secrets.HIKERAPI_KEY }}
        run: python -m src.revisar_perfiles_protegidos
