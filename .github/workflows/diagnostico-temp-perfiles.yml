name: TEMP - Piloto armar_perfiles_organizadores

# Workflow de diagnóstico temporal (mismo patrón que otros ya usados y
# borrados en el proyecto, ver ROADMAP.md): correr una vez
# armar_perfiles_organizadores.py --escribir con --limite acotado, para
# probar el piloto de "armamos tu perfil, confirmalo" contra la cola real
# antes de escalarlo. Se borra después de usarlo.

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Cuántos perfiles crear y mandar por mail (cada uno cuesta una llamada a HikerAPI + un mail real)"
        required: true
        default: "2"

concurrency:
  group: import-eventos-production
  cancel-in-progress: false

jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: import

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: import/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr piloto de perfiles (--escribir)
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HIKERAPI_KEY: ${{ secrets.HIKERAPI_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SHARED_SECRET: ${{ secrets.APPS_SCRIPT_SHARED_SECRET }}
        run: python -m src.armar_perfiles_organizadores --escribir --limite "${{ github.event.inputs.limite }}"
