name: Enviar resumen semanal de eventos (Telegram)

on:
  schedule:
    - cron: "0 12 * * 2"  # martes 09:00 hora Argentina
  workflow_dispatch: {}

jobs:
  enviar-resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: import

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: import/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Mandar resumen a Telegram
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.enviar_resumen_telegram
