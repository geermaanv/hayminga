name: Importar eventos de bioconstrucción

on:
  schedule:
    # Una sola corrida por día: no hay volumen de eventos nuevos para dos
    # (medido — ver ROADMAP.md, Etapa 9.6) y cada corrida se paga en
    # llamadas a HikerAPI. Se conservó la de la mañana: es la única de las
    # medidas que encontró eventos, y deja el día por delante para revisar
    # ?pendientes. El minuto 7 (y no 0) es a propósito: los cron en punto
    # son los más congestionados en Actions y se retrasan más.
    - cron: "7 11 * * *"  # ~08:07 hora Argentina
  workflow_dispatch: {}

concurrency:
  group: import-eventos-production
  cancel-in-progress: false

jobs:
  import-events:
    runs-on: ubuntu-latest
    # Subido de 45 a 60 (16/08/2026): la corrida del 16/08 se cortó por
    # timeout con HikerAPI teniendo un día degradado (18 errores 500/502/
    # timeout en la sección de cuentas seguidas) — no es algo que podamos
    # arreglar de nuestro lado, pero cortar la cola de cuentas por un mal
    # día ajeno es peor que darle más margen. El guardado incremental ya
    # protege contra perder todo si igual llega a pasar.
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: import

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: import/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Descubrimiento por hashtag (HikerAPI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_CLAUDE_CALLS_PER_RUN: "15"
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HIKERAPI_KEY: ${{ secrets.HIKERAPI_KEY }}
          GEMINI_MIN_INTERVAL_SECONDS: "0.5"
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SHARED_SECRET: ${{ secrets.APPS_SCRIPT_SHARED_SECRET }}
        run: python -m src.hiker_pipeline

      # La cola de mail (email_intake) se separó a su propio workflow
      # (email-intake.yml, 15/08/2026) — corre cada 3h en vez de depender
      # de este cron diario. Ver el comentario en ese archivo.

      # if: always() a propósito — el caso que más importa avisar es
      # justamente el de la corrida que falla o se cancela por timeout.
      - name: Avisar resultado por Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ESTADO_JOB: ${{ job.status }}
        run: python -m src.notificar_run
